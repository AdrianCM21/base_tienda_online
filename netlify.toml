[build]
  command = "npm run build"
  publish = "dist"

# SPA: cualquier ruta que no sea un archivo real devuelve index.html (React Router resuelve la pantalla).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
